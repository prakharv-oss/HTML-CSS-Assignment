<!doctype html>
<html lang="en">
  <head>

  </head>
  <body>
    <div id="hero">
      <h1>Coding Club</h1>
      <p>Learn. Build. Share.</p>
    </div>

      <table>
        <tr>
          <th>Event</th>
          <th>Date</th>
          <th>Venue</th>
        </tr>
        <tr>
          <td>HTML Workshop</td>
          <td>12 Nov</td>
          <td>Lab 1</td>
        </tr>
        <tr>
          <td>Hackathon</td>
          <td>20 Nov</td>
          <td>Seminar Hall</td>
        </tr>
      </table>
    </div>
    <div class="card">
      <h2>Register</h2>
      <p>Name: <input type="text" placeholder="Your name" /></p>
      <p>Email: <input type="email" placeholder="you@example.com" /></p>
      <button>Register</button>
    </div>
  </body>
</html>
